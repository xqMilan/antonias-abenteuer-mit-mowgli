<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antonias Abenteuer mit Mowgli</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #8fd3f4;
        }
        canvas {
            /* Füllt den Bildschirm per CSS, unabhängig davon, wann JS die
               Zeichenauflösung neu berechnet - sonst bleibt bei mobilen
               Browsern (Adressleiste ein-/ausblenden) kurz ein Rand übrig. */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            /* verhindert Scrollen/Zoomen beim Tippen auf dem Handy */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
